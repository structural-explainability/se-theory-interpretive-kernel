# ============================================================
# lakefile.toml
# ============================================================
# Declares the public Lean package identity, import surface,
# build targets, dependencies, and verification executables.

# Run with:
# lake build
# lake test

# ============================================================
# === PROJECT IDENTITY ===
# ============================================================

name = "se-theory-interpretive-kernel"
version = "0.4.1" # CUSTOM: Sets the current release version
license = "Apache-2.0"

keywords = [
  "structural-explainability",
  "formal-contract",
  "neutrality",
  "identity-regimes",
  "invariants",
  "formal-specification",
  "formal-verification",
  "proof-carrying",
  "theorem-proving",
  "lean4",
]

# ============================================================
# === BUILD SURFACE ===
# ============================================================
# defaultTargets must include the public Lean library root.

defaultTargets = ["SE.InterpretiveKernel"]
testDriver = "SETest"

# ============================================================
# === DEPENDENCIES ===
# ============================================================

[[require]]
name = "se-theory-neutral-substrate"
git = "https://github.com/structural-explainability/se-theory-neutral-substrate"
rev = "v0.13.0"

[[require]]
name = "se-theory-transformation"
git = "https://github.com/structural-explainability/se-theory-transformation"
rev = "v0.6.1"

# ============================================================
# === PUBLIC LIBRARY ===
# ============================================================
# The library downstream packages import. It must claim only the module
# family owned by this package. Other packages own other SE.* families.
#
# Do not claim the shared top-level module "SE". Multiple theory packages
# coexist in the same dependency graph, so each library must own only its
# namespaced family (for example SE.Persistence or SE.Transformation).
#
# Glob forms:
#   "A.B"    only module A.B
#   "A.B.*"  A.B and all its submodules
#   "A.B.+"  all submodules of A.B, but not A.B itself

[[lean_lib]]
name = "SE.InterpretiveKernel"
roots = ["SE.InterpretiveKernel"]
globs = ["SE", "SE.InterpretiveKernel.*"]

# ============================================================
# === TEST LIBRARY ===
# ============================================================
# Internal verification; not part of downstream public import surface.

[[lean_lib]]
name = "SETest"
roots = ["SETest.InterpretiveKernel"]
globs = ["SETest", "SETest.InterpretiveKernel.*"]
