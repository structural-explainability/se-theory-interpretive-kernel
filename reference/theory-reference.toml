# ============================================================
# reference/theory-reference.toml
# ============================================================
# Theory reference configuration.
#
# WHY: The theory repository owns Lean source, reference TOML, and exported
# JSON artifacts. The reusable kit owns validation, export, catalog, scaffold,
# and inspection machinery.

schema = "se-theory-reference"
schema_version = "0.1.0"

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "se-theory-interpretive-kernel"
theory = "identity-regimes"
description = "Identity regimes theory repository for Structural Explainability."

# === Lean Public Surface ===

[lean]
root_module = "SE"
public_modules = [
    "SE",
    "SE.InterpretiveKernel",
    # Get the following with:
    # Get-ChildItem .\SE\InterpretiveKernel -Recurse -Filter *.lean |
    # ForEach-Object { $_.FullName.Substring((Get-Location).Path.Length + 1) } |
    # Sort-Object
    "SE.InterpretiveKernel.Adjunction",
    "SE.InterpretiveKernel.Core",
    "SE.InterpretiveKernel.Generating",
    "SE.InterpretiveKernel.Kernel",
    "SE.InterpretiveKernel.Lattice",
    "SE.InterpretiveKernel.Lifting",
    "SE.InterpretiveKernel.Preservation",
    "SE.InterpretiveKernel.Representation",
    "SE.InterpretiveKernel.Signature",
    "SE.InterpretiveKernel.Threshold",
    "SE.InterpretiveKernel.Witness",
]

test_modules = ["SETest"]

# === Reference Artifacts ===

[reference]
root = "reference"

# === Exported Machine Artifacts ===

[export]
root = "data/interpretive-kernel"

# === Surface-Kind Mapping ===

[surface_kinds]
type = "reference/interpretive-kernel-types.toml"
vocabulary = "reference/interpretive-kernel-vocabulary.toml"
predicate = "reference/interpretive-kernel-predicates.toml"
theorem = "reference/interpretive-kernel-theorems.toml"

# === Export Mapping ===

[export_map]
catalog = "data/interpretive-kernel/interpretive-kernel-catalog.json"
