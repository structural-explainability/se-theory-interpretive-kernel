# ============================================================
# Interpretive Kernel Predicates
# se-theory-interpretive-kernel
# ============================================================
# Public Prop-valued definitions: order and lattice operations on relations, the interpretation-induced kernel, coherence, the generated occurrence regime, admissibility, and pairwise demand.

schema = "se-predicate-registry-1"
kind = "predicate"
repo = "se-theory-interpretive-kernel"
surface_module = "SE.InterpretiveKernel"
namespace = "SE.InterpretiveKernel"

[predicate.Finer]
order = 1
id = "Finer"
cite_id = "IK.DEF.FINER"
name = "Finer"
lean_symbol = "SE.InterpretiveKernel.Finer"
lean_kind = "def"
source_module = "SE.InterpretiveKernel.Core"
description = "Relation inclusion R ⊆ S. For equivalence relations, R is a finer partition than S. Finer R S is R ≤ S in the documentation."

[predicate.Coarser]
order = 2
id = "Coarser"
cite_id = "IK.DEF.COARSER"
name = "Coarser"
lean_symbol = "SE.InterpretiveKernel.Coarser"
lean_kind = "def"
source_module = "SE.InterpretiveKernel.Core"
description = "Coarser R S is Finer S R."

[predicate.KernelRel]
order = 3
id = "KernelRel"
cite_id = "IK.DEF.KERNEL_REL"
name = "Kernel rel"
lean_symbol = "SE.InterpretiveKernel.kernelRel"
lean_kind = "def"
source_module = "SE.InterpretiveKernel.Kernel"
description = "kernelRel I Q ρ e e' : every selected probe sends e and e' to ρ-related outputs."

[predicate.Coherent]
order = 4
id = "Coherent"
cite_id = "IK.DEF.COHERENT"
name = "Coherent"
lean_symbol = "SE.InterpretiveKernel.Coherent"
lean_kind = "def"
source_module = "SE.InterpretiveKernel.Kernel"
description = "Coherence of a frame relation φ with an occurrence relation ρ through I and Q: φ ≤ K_Q(ρ), i.e. Finer φ (kernelRel I Q ρ). A mathematical compatibility condition only."

[predicate.Generators]
order = 5
id = "Generators"
cite_id = "IK.DEF.GENERATORS"
name = "Generators"
lean_symbol = "SE.InterpretiveKernel.generators"
lean_kind = "def"
source_module = "SE.InterpretiveKernel.Lifting"
description = "Generating pairs of occurrences: (I p e, I p e') with Q p and φ e e'."

[predicate.LiftRel]
order = 6
id = "LiftRel"
cite_id = "IK.DEF.LIFT_REL"
name = "Lift rel"
lean_symbol = "SE.InterpretiveKernel.liftRel"
lean_kind = "def"
source_module = "SE.InterpretiveKernel.Lifting"
description = "L_Q(φ): equivalence closure of the generating pairs."

[predicate.Compatible]
order = 7
id = "Compatible"
cite_id = "IK.DEF.COMPATIBLE"
name = "Compatible"
lean_symbol = "SE.InterpretiveKernel.Compatible"
lean_kind = "def"
source_module = "SE.InterpretiveKernel.Lifting"
description = "ρ is a compatible occurrence relation for φ: an equivalence relation with which φ is coherent."

