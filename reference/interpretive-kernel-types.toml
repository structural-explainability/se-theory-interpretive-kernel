lean_kind = "structure"
source_module = "SE.InterpretiveKernel.Representation"
description = "An Eq(A)-valued generalized (pseudo-)ultrametric on X. The three laws are the paper's (U1)-(U3) in inequality form."

[type.IncompatibilityWitness]
order = 3
id = "IncompatibilityWitness"
cite_id = "IK.TYPE.INCOMPATIBILITY_WITNESS"
name = "Incompatibility witness"
lean_symbol = "SE.InterpretiveKernel.IncompatibilityWitness"
lean_kind = "structure"
source_module = "SE.InterpretiveKernel.Witness"
description = "A finite incompatibility witness against coherence of φ with ρ."
