# Public Lean types for the theory.

schema = "se-type-registry-1"
kind = "type"
repo = "se-theory-interpretive-kernel"
surface_module = "SE.InterpretiveKernel"
namespace = "SE.InterpretiveKernel"

[type.EqvClosure]
order = 1
id = "EqvClosure"
cite_id = "IK.TYPE.EQV_CLOSURE"
name = "Eqv closure"
lean_symbol = "SE.InterpretiveKernel.EqvClosure"
lean_kind = "inductive"
source_module = "SE.InterpretiveKernel.Core"
description = "The equivalence relation generated by r: the least equivalence relation containing r (minimality is EqvClosure.le_of_equivalence)."

[type.GeneralizedUltrametric]
order = 2
id = "GeneralizedUltrametric"
cite_id = "IK.TYPE.GENERALIZED_ULTRAMETRIC"
