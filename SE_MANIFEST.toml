# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_version = "0.5.2"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "se-theory-interpretive-kernel"
class = "theory"
kind = "foundation"
status = "active"
since = "2026"
summary = "Lean 4 formalization of the Interpretive Kernel: how equivalence relations on distinct carriers are connected by interpretation, with its adjunction, thresholds, and generalized-ultrametric representation."

# === Layer Position ===

[layer]
space = "formal-theory"
role = "theory"

# === Dependency Declarations ===

[depends]
required = []

# Optional upstream repository dependencies.
optional = [
  { repository = "se-theory-neutral-substrate", kind = "semantic" },
  { repository = "se-theory-transformation", kind = "semantic" },
]

# === Provided Artifacts ===

[provides]
# Logical artifacts exposed by this repository.
# These are stable identifiers, not file paths.
artifacts = [
  "lean-library",
  "theorem-set",
]

# === Scope ===

[scope]
includes = [
  "interpretation-induced kernel over a selected probe family",
  "generated occurrence regime and its adjunction with the kernel",
  "coherence, admissibility, and interpretive thresholds",
  "pairwise interpretive demand and its generalized-ultrametric representation",
  "finite incompatibility witnesses",
  "finite examples and counterexamples",
  "machine-checked Lean theorems",
  "machine-readable reference artifacts for the public Lean surface",
]

excludes = [
  "neutral substrate primitives",
  "identity-regime taxonomy and regime profiles",
  "persistence behavior",
  "operational auditing of implemented identity rules",
  "comparison liftings from output regimes to structured objects",
  "domain-specific interpretations, including scheduling",
  "empirical validation of probes, interpretations, or equivalence criteria",
  "computational complexity of finite procedures",
  "repository governance rules",
  "schema definitions for other repositories",
  "runtime systems",
]

# === Validation ===

[validation]
# Validates repository declaration, manifest schema conformance,
# reference artifacts, generated artifacts, and Lean public surface coverage.
export_check_entrypoint = "uv run --locked se-theory-reference export --check"
reference_entrypoint = "uv run --locked se-theory-reference validate"
strict_entrypoint = "uv run --locked se-theory-reference validate --strict"

# === Behavior / governance ===

[naming]
pattern = "se-theory-*"

[governance]
authority = "structural-explainability"

# === External references ===

[citation]
cff = "CITATION.cff"
preferred = "CITATION.cff"

[traceability]
identifier_map = "reference/theory-reference.toml"
